name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version
      - run: swift test
      - name: Bundle (universal, unsigned)
        run: |
          scripts/bundle.sh
          lipo -archs .build/dist/zyx.app/Contents/MacOS/Zyx | grep -q "x86_64 arm64"
